<div>
  <h2>My Tasks</h2>

  <input [(ngModel)]="newTitle" placeholder="New task title" />
  <button (click)="addTask()">Add</button>

  <ul>
    <li *ngFor="let task of tasks">
      {{ task.title }} — {{ task.status }}
      <button (click)="deleteTask(task.id!)">Delete</button>
    </li>
  </ul>
</div>
